name: Weekly status digest

# Every Monday 06:00 UTC (hour after the auto-archive workflows), queries all
# of Chris's boards (Personal, mods, TCS Timeline, games), aggregates
# In Progress + In QA + recently-Done items + un-boarded issues (UNBOARDED_V1)
# into ONE issue on Godimas101/personal-projects. That issue gets:
#   - Label: `weekly-digest`
#   - Auto-added to Personal Projects board (Godimas101/projects/2)
#   - Board Status: `In QA` (needs Chris's eyes each week)
# Previous week's digest is auto-closed AND its board Status flipped to `Done`
# so the current snapshot is always the one open In QA item labelled
# `weekly-digest` on Personal Projects.
#
# Requires PERSONAL_PROJECT_TOKEN (classic PAT with `project` + `repo` scopes)
# — classic PAT respects Chris's user permissions across gitpush-mod and
# The-Canadian-Space orgs, so ONE token is enough for all 14 boards AND
# for cross-repo issue writes on personal-projects.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      warn_stale_days:
        description: 'Warn if In QA items are older than this many days'
        required: false
        default: '3'
      window_days:
        description: 'Include Done items closed in last N days'
        required: false
        default: '7'

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PERSONAL_PROJECT_TOKEN }}
      WARN_STALE_DAYS: ${{ inputs.warn_stale_days || '3' }}
      WINDOW_DAYS: ${{ inputs.window_days || '7' }}
    steps:
      - name: Build + file digest
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::PERSONAL_PROJECT_TOKEN secret is not set on Godimas101/.github."
            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from datetime import datetime, timedelta, timezone

          # Board catalogue
          BOARDS = [
              # (owner_type, owner, number, label)
              ("user", "Godimas101",         2, "Personal Projects"),
              ("org",  "gitpush-mod",        3, "InfoLCD Apex Update"),
              ("org",  "gitpush-mod",        4, "InfoLCD Apex Advanced"),
              ("org",  "gitpush-mod",        5, "Not Just For Looks"),
              ("org",  "gitpush-mod",        6, "NJFL — Additions"),
              ("org",  "gitpush-mod",        7, "NJFL — Without Weapons"),
              ("org",  "gitpush-mod",        8, "Tiered Build and Repair"),
              ("org",  "gitpush-mod",        9, "SG Core Mods"),
              ("org",  "gitpush-mod",       10, "Mod Adjuster Mods"),
              ("org",  "gitpush-mod",       11, "ZuluBetterHeroes Reforged"),
              ("org",  "gitpush-mod",       12, "R13verGrrl"),
              ("org",  "The-Canadian-Space", 1, "TCS Timeline"),
              ("org",  "The-Canadian-Space", 2, "Idle Launch"),
              ("org",  "The-Canadian-Space", 3, "AutoDoom"),
          ]

          WARN_STALE = int(os.environ.get("WARN_STALE_DAYS", "3"))
          WINDOW_DAYS = int(os.environ.get("WINDOW_DAYS", "7"))
          now = datetime.now(timezone.utc)
          today = now.date()
          window_start = now - timedelta(days=WINDOW_DAYS)
          stale_cutoff = now - timedelta(days=WARN_STALE)

          def gql(query):
              env = os.environ.copy()
              env["GH_TOKEN"] = os.environ["GH_TOKEN"]
              r = subprocess.run(
                  ["gh", "api", "graphql", "-f", f"query={query}"],
                  capture_output=True, text=True, encoding="utf-8", env=env,
              )
              if r.returncode != 0:
                  print(f"::warning::gh gql failed (exit={r.returncode}): stderr={r.stderr[:300]} stdout={r.stdout[:300]}", file=sys.stderr)
                  return None
              try:
                  parsed = json.loads(r.stdout)
              except json.JSONDecodeError as e:
                  print(f"::warning::gh gql JSON parse failed: {e} — stdout={r.stdout[:300]}", file=sys.stderr)
                  return None
              if "errors" in parsed:
                  print(f"::warning::gh gql GraphQL errors: {parsed['errors']}", file=sys.stderr)
                  return None
              return parsed

          def fetch_items(owner_type, owner, num):
              root = "organization" if owner_type == "org" else "user"
              q = (
                  '{ ' + root + '(login: "' + owner + '") { projectV2(number: ' + str(num) + ') { '
                  'title url items(first: 100) { nodes { '
                  'id updatedAt '
                  'content { ... on DraftIssue { title } ... on Issue { title url } ... on PullRequest { title url } } '
                  'fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } '
                  '} } } } }'
              )
              d = gql(q)
              if not d or "data" not in d or not d["data"]:
                  return None, None, []
              node = d["data"].get(root) or {}
              proj = node.get("projectV2") or {}
              if not proj:
                  return None, None, []
              items = (proj.get("items") or {}).get("nodes", []) or []
              return proj.get("title"), proj.get("url"), items

          # Collect
          in_progress = []  # (board_label, board_url, item_title, item_url, updatedAt)
          in_qa = []
          done_recent = []
          backlog = []  # BACKLOG_IN_UNBOARDED_V1 — items on any board with Status="Backlog"

          for owner_type, owner, num, label in BOARDS:
              title, url, items = fetch_items(owner_type, owner, num)
              if title is None:
                  print(f"  ! {label}: could not fetch")
                  continue
              for it in items:
                  status = ((it.get("fieldValueByName") or {}).get("name")) or ""
                  content = it.get("content") or {}
                  item_title = content.get("title") or "(no title)"
                  # DraftIssue has no public url — fall back to the board url
                  item_url = content.get("url") or url
                  updated_iso = it.get("updatedAt") or ""
                  try:
                      updated = datetime.fromisoformat(updated_iso.replace("Z", "+00:00"))
                  except ValueError:
                      updated = now

                  entry = (label, url, item_title, item_url, updated)
                  if status == "In Progress":
                      in_progress.append(entry)
                  elif status == "In QA":
                      in_qa.append(entry)
                  elif status == "Backlog":
                      backlog.append(entry)
                  elif status == "Done" and updated >= window_start:
                      done_recent.append(entry)

          # UNBOARDED_V1 (2026-07-25): walk repos across Chris's owners for open
          # issues with zero project attachments — catches the class of issue
          # opened on a repo but never added to a board (e.g. slipped through
          # for weeks unnoticed). Sorted oldest first.
          UNBOARDED_OWNERS = [
              ("user", "Godimas101"),
              ("org",  "gitpush-mod"),
              ("org",  "The-Canadian-Space"),
          ]

          def fetch_unboarded_issues(owner_type, owner):
              # UNBOARDED_OWNER_AFFILIATION_V1 (2026-07-27): the default
              # `user(login).repositories(...)` returns repos with
              # ownerAffiliations=[OWNER, COLLABORATOR, ORGANIZATION_MEMBER]
              # when the query runs authenticated as that user — so org repos
              # bleed into the Godimas101 pass AND get scanned again under
              # their own org pass, producing duplicate issue rows in the
              # digest (each once per owner label). Restrict to [OWNER] so
              # every repo is scanned exactly once by its true owner.
              root = "organization" if owner_type == "org" else "user"
              found = []
              cursor = None
              while True:
                  after = f', after: "{cursor}"' if cursor else ""
                  q = (
                      '{ ' + root + '(login: "' + owner + '") { '
                      f'repositories(first: 100{after}, isArchived: false, isFork: false, ownerAffiliations: [OWNER]) {{ '
                      'pageInfo { hasNextPage endCursor } '
                      'nodes { name isPrivate '
                      'issues(first: 100, states: OPEN) { nodes { '
                      'number title url createdAt updatedAt '
                      'projectItems(first: 5) { totalCount } '
                      '} } '
                      '} } } }'
                  )
                  d = gql(q)
                  if not d or "data" not in d or not d["data"]:
                      break
                  node = d["data"].get(root) or {}
                  repos = node.get("repositories") or {}
                  for repo in repos.get("nodes", []) or []:
                      repo_name = repo.get("name")
                      for iss in (repo.get("issues") or {}).get("nodes", []) or []:
                          proj_count = ((iss.get("projectItems") or {}).get("totalCount")) or 0
                          if proj_count == 0:
                              found.append((owner, repo_name, iss))
                  page_info = repos.get("pageInfo") or {}
                  if not page_info.get("hasNextPage"):
                      break
                  cursor = page_info.get("endCursor")
              return found

          unboarded = []
          seen_urls = set()  # belt-and-suspenders dedup by issue URL
          for owner_type, owner in UNBOARDED_OWNERS:
              batch = fetch_unboarded_issues(owner_type, owner)
              added = 0
              for entry in batch:
                  url = (entry[2].get("url") or "").strip()
                  if url and url in seen_urls:
                      continue
                  if url:
                      seen_urls.add(url)
                  unboarded.append(entry)
                  added += 1
              print(f"  unboarded scan {owner}: {added} new issue(s) ({len(batch)} raw)")

          # Sort by createdAt ascending (oldest first — most likely to be forgotten)
          def _iss_created(entry):
              iso = entry[2].get("createdAt") or ""
              try:
                  return datetime.fromisoformat(iso.replace("Z", "+00:00"))
              except ValueError:
                  return now
          unboarded.sort(key=_iss_created)
          # Backlog: oldest updatedAt first (index 4 in the tuple — same shape as in_qa)
          backlog.sort(key=lambda e: e[4])

          # Sort: in-progress + done_recent by updated desc, in_qa by oldest first
          in_progress.sort(key=lambda e: e[4], reverse=True)
          done_recent.sort(key=lambda e: e[4], reverse=True)
          in_qa.sort(key=lambda e: e[4])

          # Build body
          lines = [
              f"Automated weekly digest for the week of **{today.isoformat()}**.",
              "",
              f"Windows: In Progress + In QA = current state. Recently Done = closed within last {WINDOW_DAYS} days. Stale-QA threshold = {WARN_STALE} days.",
              "",
          ]

          if in_qa:
              stale_count = sum(1 for e in in_qa if e[4] < stale_cutoff)
              header = f"## 🔍 In QA — {len(in_qa)} item(s) waiting on Chris"
              if stale_count:
                  header += f" ⚠️ **{stale_count} sitting for > {WARN_STALE} days**"
              lines.append(header)
              lines.append("")
              lines.append("| Board | Item | Age | ⚠ |")
              lines.append("|---|---|---|---|")
              for label, board_url, item_title, item_url, updated in in_qa:
                  age_days = (now - updated).days
                  stale_mark = "⚠️" if updated < stale_cutoff else ""
                  # Truncate long titles
                  short = item_title if len(item_title) <= 80 else item_title[:77] + "..."
                  lines.append(f"| [{label}]({board_url}) | [{short}]({item_url}) | {age_days}d | {stale_mark} |")
              lines.append("")
          else:
              lines.append("## 🔍 In QA — clear ✅")
              lines.append("")
              lines.append("Nothing waiting on you.")
              lines.append("")

          if in_progress:
              lines.append(f"## 🚧 In Progress — {len(in_progress)} item(s)")
              lines.append("")
              lines.append("| Board | Item | Last touched |")
              lines.append("|---|---|---|")
              for label, board_url, item_title, item_url, updated in in_progress:
                  age_days = (now - updated).days
                  age_str = "today" if age_days == 0 else f"{age_days}d ago"
                  short = item_title if len(item_title) <= 80 else item_title[:77] + "..."
                  lines.append(f"| [{label}]({board_url}) | [{short}]({item_url}) | {age_str} |")
              lines.append("")
          else:
              lines.append("## 🚧 In Progress — quiet")
              lines.append("")
              lines.append("Nothing actively being worked on across any board.")
              lines.append("")

          # BACKLOG + UNBOARDED — items not being actively worked on:
          #   - board items with Status="Backlog" (parked but visible on a board)
          #   - open repo issues with zero project attachments (never boarded)
          # Merged here so Chris sees everything that isn't In Progress / In QA
          # in one place, and can either action it or accept it as parked.
          if backlog or unboarded:
              total = len(backlog) + len(unboarded)
              lines.append(f"## 🚨 Backlog + un-boarded — {total} item(s) not being actively worked on")
              lines.append("")
              lines.append("Board items sitting in Backlog, plus repo-level issues that were never added to a board. Triage each: either move it forward, or accept it as parked.")
              lines.append("")
              lines.append("| Source | Item | Age |")
              lines.append("|---|---|---|")
              # Backlog first (oldest updatedAt), then un-boarded (oldest createdAt)
              for label, board_url, item_title, item_url, updated in backlog:
                  age_days = (now - updated).days
                  age_str = "today" if age_days == 0 else f"{age_days}d"
                  short = item_title if len(item_title) <= 80 else item_title[:77] + "..."
                  lines.append(f"| [{label}]({board_url}) | [{short}]({item_url}) | {age_str} |")
              for owner_login, repo_name, iss in unboarded:
                  created = _iss_created((owner_login, repo_name, iss))
                  age_days = (now - created).days
                  age_str = "today" if age_days == 0 else f"{age_days}d"
                  title_raw = iss.get("title") or "(no title)"
                  short = title_raw if len(title_raw) <= 80 else title_raw[:77] + "..."
                  iss_url = iss.get("url") or f"https://github.com/{owner_login}/{repo_name}/issues"
                  repo_url = f"https://github.com/{owner_login}/{repo_name}/issues"
                  lines.append(f"| [{owner_login}/{repo_name} (un-boarded)]({repo_url}) | [#{iss.get('number','?')} — {short}]({iss_url}) | {age_str} |")
              lines.append("")

          if done_recent:
              lines.append(f"## ✅ Recently Done — {len(done_recent)} item(s) closed in the last {WINDOW_DAYS} days")
              lines.append("")
              lines.append("| Board | Item | Closed |")
              lines.append("|---|---|---|")
              for label, board_url, item_title, item_url, updated in done_recent:
                  age_days = (now - updated).days
                  age_str = "today" if age_days == 0 else f"{age_days}d ago"
                  short = item_title if len(item_title) <= 80 else item_title[:77] + "..."
                  lines.append(f"| [{label}]({board_url}) | [{short}]({item_url}) | {age_str} |")
              lines.append("")

          lines.append("---")
          lines.append("")
          lines.append(f"Boards queried: {len(BOARDS)}. Runs weekly on Mondays 06:00 UTC via [`weekly-digest.yml`](https://github.com/Godimas101/.github/blob/main/.github/workflows/weekly-digest.yml). Filed on [Godimas101/personal-projects](https://github.com/Godimas101/personal-projects/issues?q=is%3Aissue+label%3Aweekly-digest) with label `weekly-digest`, auto-added to [Personal Projects board](https://github.com/users/Godimas101/projects/2) with Status `In QA`. Previous week's digest is auto-closed + flipped to Status `Done`. Manual re-run: **Actions → Weekly status digest → Run workflow**.")

          body = "\n".join(lines)
          title = f"Weekly status digest — {today.isoformat()}"

          # BOARD_LANDING_V1 (2026-07-25): file on personal-projects repo, surface
          # on Personal Projects board with Status=In QA (needs Chris's eyes each
          # week). Close-and-flip-to-Done for the previous week's digest.
          PP_REPO             = "Godimas101/personal-projects"
          PP_PROJECT_ID       = "PVT_kwHODcjVPc4BdUpf"
          PP_STATUS_FIELD_ID  = "PVTSSF_lAHODcjVPc4BdUpfzhX2_7c"
          PP_STATUS_IN_QA     = "7380ca8e"
          PP_STATUS_DONE      = "6078018e"
          DIGEST_LABEL        = "weekly-digest"

          def gql_mutate(query):
              r = subprocess.run(
                  ["gh", "api", "graphql", "-f", f"query={query}"],
                  capture_output=True, text=True, encoding="utf-8",
              )
              if r.returncode != 0:
                  print(f"::warning::gql mutate failed (exit={r.returncode}): {r.stderr[:300]}", file=sys.stderr)
                  return None
              try:
                  parsed = json.loads(r.stdout)
              except json.JSONDecodeError as e:
                  print(f"::warning::gql mutate parse failed: {e}", file=sys.stderr)
                  return None
              if "errors" in parsed:
                  print(f"::warning::gql mutate GraphQL errors: {parsed['errors']}", file=sys.stderr)
                  return None
              return parsed

          def find_board_item_id(issue_node_id):
              d = gql(
                  '{ node(id: "' + issue_node_id + '") { ... on Issue { '
                  'projectItems(first: 20) { nodes { id project { id } } } } } }'
              )
              if not d or not d.get("data", {}).get("node"):
                  return None
              for n in (d["data"]["node"].get("projectItems") or {}).get("nodes", []) or []:
                  if ((n.get("project") or {}).get("id")) == PP_PROJECT_ID:
                      return n.get("id")
              return None

          def set_board_status(item_id, option_id):
              return gql_mutate(
                  'mutation { updateProjectV2ItemFieldValue(input: { '
                  f'projectId: "{PP_PROJECT_ID}" itemId: "{item_id}" '
                  f'fieldId: "{PP_STATUS_FIELD_ID}" '
                  f'value: {{ singleSelectOptionId: "{option_id}" }} '
                  '}) { projectV2Item { id } } }'
              )

          # Close previous open digests + flip their board Status to Done
          prev_raw = subprocess.check_output(
              ["gh", "issue", "list", "-R", PP_REPO,
               "--state", "open", "--label", DIGEST_LABEL,
               "--json", "number,title,id"],
              text=True, encoding="utf-8",
          )
          prev_list = json.loads(prev_raw)
          for iss in prev_list:
              if iss["title"] == title:
                  continue
              subprocess.check_call(
                  ["gh", "issue", "close", "-R", PP_REPO, str(iss["number"]),
                   "--comment", f"Superseded by {title}"],
              )
              board_item_id = find_board_item_id(iss["id"])
              if board_item_id:
                  set_board_status(board_item_id, PP_STATUS_DONE)
                  print(f"  closed + Status=Done: #{iss['number']}")
              else:
                  print(f"  closed (not on board): #{iss['number']}")

          # Check if today's digest already exists — if so, edit its body
          today_exists = any(iss["title"] == title for iss in prev_list)
          with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False, encoding="utf-8") as tmp:
              tmp.write(body)
              tmp_path = tmp.name

          if today_exists:
              num = next(iss["number"] for iss in prev_list if iss["title"] == title)
              subprocess.check_call(
                  ["gh", "issue", "edit", "-R", PP_REPO,
                   str(num), "--body-file", tmp_path],
              )
              print(f"  updated existing: #{num} — {title}")
          else:
              # Create the issue on personal-projects
              issue_url = subprocess.check_output(
                  ["gh", "issue", "create", "-R", PP_REPO,
                   "--title", title, "--body-file", tmp_path,
                   "--label", DIGEST_LABEL],
                  text=True, encoding="utf-8",
              ).strip()
              print(f"  filed: {issue_url}")
              # Fetch node ID → add to Personal Projects board → set Status=In QA
              new_num = issue_url.rstrip("/").split("/")[-1]
              nd = gql(
                  '{ repository(owner: "Godimas101", name: "personal-projects") { '
                  f'issue(number: {new_num}) {{ id }} }} }}'
              )
              new_node_id = ((nd or {}).get("data", {}).get("repository", {}) or {}).get("issue", {}) or {}
              new_node_id = new_node_id.get("id") if isinstance(new_node_id, dict) else None
              if new_node_id:
                  add_result = gql_mutate(
                      'mutation { addProjectV2ItemById(input: { '
                      f'projectId: "{PP_PROJECT_ID}" contentId: "{new_node_id}" '
                      '}) { item { id } } }'
                  )
                  new_item = ((add_result or {}).get("data", {}) or {}).get("addProjectV2ItemById", {}) or {}
                  new_item_id = (new_item.get("item") or {}).get("id")
                  if new_item_id:
                      set_board_status(new_item_id, PP_STATUS_IN_QA)
                      print(f"  added to Personal Projects board (item {new_item_id}), Status=In QA")
                  else:
                      print("::warning::Could not add new issue to Personal Projects board")
              else:
                  print("::warning::Could not fetch new issue node ID — board add skipped")
          PY
